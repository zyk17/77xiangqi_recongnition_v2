paths:
  boards_root: data/raw/boards
  pieces_root: data/raw/pieces
  output_root: data/processed/train_cells

synthesis:
  # Each split uses every assigned skin exactly this many times.
  samples_per_skin: 20
  random_seed: 42
  piece_scale_in_cell: 0.82
  piece_skin_ids: all_complete
  train_piece_skin_ids:
  skin_sampling: balanced
  val_piece_skin_ids:
    - normal_002
    - normal_013
    - normal_061
    - normal_096
    - normal_080
    - normal_067
    - normal_037
    - normal_001
    - normal_025
    - normal_003
    - normal_110
    - normal_005
    - normal_100
    - normal_023
    - normal_035
    - normal_113
    - normal_047
    - normal_008
    - normal_032
    - normal_016
    - normal_039
    - normal_009
    - normal_105
    - normal_115
    - renpang_013
    - normal_103
    - normal_004
    - normal_020
    - normal_026
    - normal_042
    - normal_094
    - renpang_014
  fen_variants:
    - "9/9/9/9/9/9/9/9/9/9"
    - "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR"

layout:
  mode: random_mixed
  random_mixed_fixed_prob: 0.18

synthetic_augmentation:
  enabled: true
  brightness: 0.09
  contrast: 0.09
  saturation: 0.09
  hue: 0.03
  gaussian_blur_enabled: true
  gaussian_blur_prob: 0.22
  gaussian_blur_kernel_size: 3
  gaussian_blur_sigma_min: 0.1
  gaussian_blur_sigma_max: 0.42
  noise_enabled: true
  noise_prob: 0.32
  noise_std: 4.0
  jpeg_enabled: true
  jpeg_prob: 0.18
  jpeg_quality_min: 65
  jpeg_quality_max: 92
  paste_jitter_frac: 0.035

realistic_nuisance:
  enabled: true
  stain_prob: 0.085
  stain_max_per_image: 4
  stain_radius_px_min: 2
  stain_radius_px_max: 8
  stain_alpha_max: 0.26
  edge_occlusion_prob: 0.065
  edge_strip_px_min: 2
  edge_strip_px_max: 10
  edge_cover_frac_min: 0.16
  edge_cover_frac_max: 0.36

scene_placement:
  enabled: true
  left_margin_frac_min: 0.0
  left_margin_frac_max: 0.12
  right_margin_frac_min: 0.0
  right_margin_frac_max: 0.12
  top_margin_frac_min: 0.03
  top_margin_frac_max: 0.28
  bottom_margin_frac_min: 0.03
  bottom_margin_frac_max: 0.28
  wide_screen_prob: 0.5
  wide_aspect_min: 1.45
  wide_aspect_max: 2.0
  narrow_aspect_min: 0.6
  narrow_aspect_max: 0.84
  clean_scene_prob: 0.0
  background_blocks_prob: 0.3
  background_blocks_min: 1
  background_blocks_max: 3
  background_lines_prob: 0.0
  background_lines_min: 0
  background_lines_max: 0
  text_nuisance_prob: 0.0
  text_count_min: 1
  text_count_max: 1
  text_size_min: 12
  text_size_max: 18
  text_tokens: []
  background_blur_prob: 0.12
  background_blur_radius_min: 0.8
  background_blur_radius_max: 2.6
  background_shade_alpha_min: 6
  background_shade_alpha_max: 22
  board_shadow_prob: 0.28
  top_bar_prob: 0.2
  bottom_panel_prob: 0.25
  side_panel_prob: 0.2
  floating_badge_prob: 0.2
  board_occluder_prob: 0.12
  board_occluder_count_min: 1
  board_occluder_count_max: 2
  toolbar_icon_count_min: 3
  toolbar_icon_count_max: 7
  secondary_board_prob: 0.0
  scene_scale_min: 0.9
  scene_scale_max: 1.12

piece_halo:
  enabled: true
  prob: 0.14
  radius_frac: 0.5
  ring_layers: 4
  alpha_outer_min: 22
  alpha_outer_max: 58
  red_tint_prob: 0.45

empty_marker_nuisance:
  enabled: true
  prob_empty_cell: 0.16
  max_markers_per_board: 28
  radius_px_min: 5
  radius_px_max: 18
  alpha_min: 90
  alpha_max: 210
  color_modes: [white, gold, orange, ui_red]

sampling:
  pad_fraction: 0.0
  inset_fraction: [0.0, 0.0, 0.0, 0.0]

output:
  clear_before_build: true
